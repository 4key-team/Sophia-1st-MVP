  # Redis for memory caching
  redis:
    image: redis:7-alpine
    container_name: sophia-redis
    ports:
      - "6379:6379"

    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    volumes:
      - redis-data:/data

    networks:
      - sophia-network

